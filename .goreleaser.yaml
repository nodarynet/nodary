# goreleaser configuration for the nodary binary.
#
# Every channel ships this one artifact and nothing else
# (docs/adr/0004-release-artifacts-and-channels.md). Wheels, npm packages and
# the Homebrew bottle are all built from the binaries produced here.
version: 2

project_name: nodary

before:
  hooks:
    # The embedded component manifest must match upstream before we cut a
    # release: a stale URL is a broken install for everyone who runs it.
    - python3 hack/update-manifest.py --check
    - go mod tidy
    - go test ./...

builds:
  - id: nodary
    main: ./cmd/nodary
    binary: nodary
    # cgo-free is what makes the binary genuinely static and cross-compilable
    # (ADR 0002). modernc.org/sqlite is chosen to keep it that way.
    #
    # **GOFIPS140 is on the one build, not on a second one** (R5-26, ADR 0006
    # §2). ADR 0004's decision is "one shipped artifact", and a FIPS variant
    # beside it would give every channel two answers to "which binary is this"
    # — so the shipped binary is the FIPS build and there is nothing to choose
    # between.
    #
    # Measured before adopting it, rather than assumed free: against the plain
    # build the binary stays statically linked, is 0.27MB *smaller*, starts no
    # slower, hashes SHA-256 at the same rate and AES-GCM about 8% slower —
    # which is nothing beside a model forward pass. The only build setting that
    # differs is `fips140=on`, which the whole suite passes under.
    #
    # It ships in `on` and not `only`: `only` refuses HMAC-SHA-1 by *panicking*
    # inside hmac.New, on TOTP's path, inside an audited mutation. ADR 0006 §2
    # names the two changes that would open it.
    env:
      - CGO_ENABLED=0
      - GOFIPS140=v1.0.0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/nodarynet/nodary/internal/buildinfo.Version={{ .Version }}
      - -X github.com/nodarynet/nodary/internal/buildinfo.Commit={{ .FullCommit }}
      - -X github.com/nodarynet/nodary/internal/buildinfo.Date={{ .CommitDate }}
      # **The trust anchors, stamped here or nowhere.** Both default to a
      # placeholder that refuses, and both carried a comment saying they were
      # "stamped in at release with -ldflags" while nothing did it — so a
      # released binary would have shipped unable to verify a manifest revision
      # (ADR 0007) or a binary served to a node (R5-16), with the refusal
      # looking like a bug rather than a missing secret.
      #
      # The bare base64 payload line, not the two-line file minisign writes:
      # ParsePublicKey accepts either, and a newline inside an -X value is a
      # quoting problem with no upside.
      #
      # Separate keys on purpose (ADR 0005 §3): one key for both would put
      # whichever pipeline can reach it in the position of minting the other.
      - -X github.com/nodarynet/nodary/internal/components.TrustedKey={{ .Env.NODARY_MANIFEST_PUBKEY }}
      - -X github.com/nodarynet/nodary/internal/release.TrustedKey={{ .Env.NODARY_RELEASE_PUBKEY }}
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    mod_timestamp: "{{ .CommitTimestamp }}"

# The bare binary is the release artifact — not a tarball. install.sh fetches
# `nodary-<version>-<os>-<arch>` directly, and the wrapper packages embed the
# same file.
archives:
  - id: binary
    formats: [binary]
    name_template: "nodary-{{ .Version }}-{{ .Os }}-{{ .Arch }}"

checksum:
  # One .sha256 per artifact rather than a single combined file, because
  # install.sh fetches exactly one artifact and should not have to parse a
  # manifest of everything else.
  name_template: "{{ .ArtifactName }}.sha256"
  split: true

signs:
  # ECDSA P-256 over SHA-256, verifiable with `openssl dgst` — the only
  # verification tool install.sh can assume is present (01-install.md §2).
  - id: openssl
    artifacts: binary
    signature: "${artifact}.sig"
    cmd: openssl
    args:
      - dgst
      - -sha256
      - -sign
      - "{{ .Env.NODARY_SIGNING_KEY }}"
      - -out
      - "${signature}"
      - "${artifact}"

  # Ed25519, for out-of-band verification by anyone who has minisign — and,
  # since R5-16, for the node that verifies a binary its control plane served.
  #
  # **`-l` is not optional and is not the default.** Stock `minisign -S`
  # produces a *prehashed* `ED` signature; internal/minisign verifies only the
  # legacy `Ed` form and refuses the other by name. Measured against the real
  # tool rather than read off a man page: without `-l` the signature this
  # pipeline produces is one nodary itself cannot check, so a control plane
  # would refuse to publish its own binary at the first real release and the
  # reason would look like a corrupt artifact.
  - id: minisign
    artifacts: binary
    signature: "${artifact}.minisig"
    cmd: minisign
    args: ["-S", "-l", "-s", "{{ .Env.NODARY_MINISIGN_KEY }}", "-m", "${artifact}", "-x", "${signature}"]

# **A cask, and therefore macOS only** (R5-23, ADR 0004).
#
# `brews:` is deprecated and goreleaser's migration target is this, which
# Homebrew defines only for macOS. Narrowing the channel rather than keeping a
# formula by another route is a deliberate choice and not a regression: the tap
# had never been published to when this changed, so no install broke, and on
# macOS the binary is the operator CLI only (R5-19) — which is exactly what a
# cask is the right Homebrew idiom for. A Linux operator who wants the CLI has
# `curl … | sh`, PyPI and npm, all of which carry both platforms.
#
# The cask is pushed as soon as the release object exists, but `release.draft`
# below means the asset it points at is not downloadable until the draft is
# published — publish the draft promptly or `brew install` 404s in between.
homebrew_casks:
  - name: nodary
    ids: [binary]
    repository:
      owner: nodarynet
      name: homebrew-tap
      branch: main
      # A PAT with write access to the tap repository. The default GITHUB_TOKEN
      # is scoped to this repository and cannot push to another one.
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Casks
    homepage: "https://nodary.net"
    description: "One control plane for all of your GPU nodes"
    license: "Apache-2.0"
    # `prerelease: auto` below means a pre-release tag skips the tap rather than
    # advertising itself as the current cask.
    skip_upload: auto
    binaries: [nodary]
    # **Without this the binary is killed on first run.** The release artifacts
    # are not codesigned or notarized, so Gatekeeper quarantines anything a cask
    # downloads and macOS refuses to execute it — the failure is a dialog about
    # a damaged file, which reads as a corrupt download rather than as an
    # unsigned one. There is no test for it here: it is a property of the
    # operator's machine, not of this repository.
    hooks:
      post:
        install: |
          if system_command("/usr/bin/xattr", args: ["-h"], print_stderr: false).exit_status == 0
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/nodary"]
          end

release:
  draft: true
  prerelease: auto
  extra_files:
    # Built by hack/stamp-install.sh, not the copy in the repository: that one
    # carries a placeholder signing key and cannot verify anything. If the stamp
    # step did not run, this glob matches nothing and the release fails — which
    # is the correct outcome, because the alternative is publishing an installer
    # that refuses to install.
    - glob: build/install.sh
    # 01-install.md §2 documents fetching this next to install.sh.
    - glob: build/install.sh.minisig
  header: |
    ## nodary {{ .Version }}

    ```sh
    curl -fsSL https://nodary.net/install.sh | sh -s -- server
    ```

    Also on PyPI (`pip install nodary`), npm (`npm i -g nodary`) and Homebrew.
    Every channel ships the same binary.
  footer: |
    ### Verifying

    ```sh
    openssl dgst -sha256 -verify nodary-release.pub \
        -signature nodary-{{ .Version }}-linux-amd64.sig \
        nodary-{{ .Version }}-linux-amd64
    ```

changelog:
  use: github
  sort: asc
  filters:
    exclude: ["^docs:", "^test:", "^chore:"]
