# goreleaser configuration for the nodary binary.
#
# Every channel ships this one artifact and nothing else
# (docs/adr/0004-release-artifacts-and-channels.md). Wheels, npm packages and
# the Homebrew bottle are all built from the binaries produced here.
version: 2

project_name: nodary

before:
  hooks:
    # The embedded component manifest must match upstream before we cut a
    # release: a stale URL is a broken install for everyone who runs it.
    - python3 hack/update-manifest.py --check
    - go mod tidy
    - go test ./...

builds:
  - id: nodary
    main: ./cmd/nodary
    binary: nodary
    # cgo-free is what makes the binary genuinely static and cross-compilable
    # (ADR 0002). modernc.org/sqlite is chosen to keep it that way.
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/nodarynet/nodary/internal/buildinfo.Version={{ .Version }}
      - -X github.com/nodarynet/nodary/internal/buildinfo.Commit={{ .FullCommit }}
      - -X github.com/nodarynet/nodary/internal/buildinfo.Date={{ .CommitDate }}
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    mod_timestamp: "{{ .CommitTimestamp }}"

# The bare binary is the release artifact — not a tarball. install.sh fetches
# `nodary-<version>-<os>-<arch>` directly, and the wrapper packages embed the
# same file.
archives:
  - id: binary
    formats: [binary]
    name_template: "nodary-{{ .Version }}-{{ .Os }}-{{ .Arch }}"

checksums:
  # One .sha256 per artifact rather than a single combined file, because
  # install.sh fetches exactly one artifact and should not have to parse a
  # manifest of everything else.
  name_template: "{{ .ArtifactName }}.sha256"
  split: true

signs:
  # ECDSA P-256 over SHA-256, verifiable with `openssl dgst` — the only
  # verification tool install.sh can assume is present (01-install.md §2).
  - id: openssl
    artifacts: binary
    signature: "${artifact}.sig"
    cmd: openssl
    args:
      - dgst
      - -sha256
      - -sign
      - "{{ .Env.NODARY_SIGNING_KEY }}"
      - -out
      - "${signature}"
      - "${artifact}"

  # Ed25519, for out-of-band verification by anyone who has minisign.
  - id: minisign
    artifacts: binary
    signature: "${artifact}.minisig"
    cmd: minisign
    args: ["-S", "-s", "{{ .Env.NODARY_MINISIGN_KEY }}", "-m", "${artifact}", "-x", "${signature}"]

# ADR 0004 promises a tap with a bottle per platform, which is a formula rather
# than a cask: casks are macOS-only, and nodary's primary platform is Linux,
# where Homebrew serves formulae. One formula covers both.
#
# The formula is pushed as soon as the release object exists, but `release.draft`
# below means the asset it points at is not downloadable until the draft is
# published — publish the draft promptly or `brew install` 404s in between.
brews:
  - name: nodary
    ids: [binary]
    repository:
      owner: nodarynet
      name: homebrew-tap
      branch: main
      # A PAT with write access to the tap repository. The default GITHUB_TOKEN
      # is scoped to this repository and cannot push to another one.
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Formula
    homepage: "https://nodary.net"
    description: "One control plane for all of your GPU nodes"
    license: "Apache-2.0"
    # `prerelease: auto` below means a pre-release tag skips the tap rather than
    # advertising itself as the current formula.
    skip_upload: auto
    install: |
      bin.install "nodary"
    test: |
      system "#{bin}/nodary", "version"

release:
  draft: true
  prerelease: auto
  extra_files:
    # Built by hack/stamp-install.sh, not the copy in the repository: that one
    # carries a placeholder signing key and cannot verify anything. If the stamp
    # step did not run, this glob matches nothing and the release fails — which
    # is the correct outcome, because the alternative is publishing an installer
    # that refuses to install.
    - glob: build/install.sh
    # 01-install.md §2 documents fetching this next to install.sh.
    - glob: build/install.sh.minisig
  header: |
    ## nodary {{ .Version }}

    ```sh
    curl -fsSL https://nodary.net/install.sh | sh -s -- server
    ```

    Also on PyPI (`pip install nodary`), npm (`npm i -g nodary`) and Homebrew.
    Every channel ships the same binary.
  footer: |
    ### Verifying

    ```sh
    openssl dgst -sha256 -verify nodary-release.pub \
        -signature nodary-{{ .Version }}-linux-amd64.sig \
        nodary-{{ .Version }}-linux-amd64
    ```

changelog:
  use: github
  sort: asc
  filters:
    exclude: ["^docs:", "^test:", "^chore:"]
