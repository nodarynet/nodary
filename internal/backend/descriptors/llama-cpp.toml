# llama.cpp. dev/specs/04-backends.md §6.
#
# The third built-in, and the one that shows the descriptor format carries more
# than a vocabulary. vLLM and SGLang differ only in spelling; this one differs
# in shape -- a single GGUF file rather than a HuggingFace cache, a
# backend-specific option with no canonical equivalent, and the ability to serve
# where there is no VRAM at all.
#
# The image is `server-cuda` from ghcr.io/ggml-org/llama.cpp, the project's own
# publication, pinned by digest in components.json like every other. The same
# repository publishes `server-vulkan`, `server-intel` and a CPU-only `server`,
# which is the route to hosts that are not NVIDIA. That route is built:
# preflight, enumeration and the device flag all ask the vendor that answered
# (R4-41, R4-42, R6-14), an artifact may pin a per-vendor image (R6-13), and
# components.json pins `server-vulkan-b4738` for `amd` beside this one. A node
# whose cards are AMD resolves that image and is handed a /dev/dri render node
# instead of a CDI device; nothing about this descriptor changes. `server-intel`
# and the CPU-only `server` are not pinned -- an Intel node enumerates and then
# finds no image, which is the honest refusal rather than a gap.
#
# **None of the AMD path has run on an AMD card.** The development fleet is
# WSL2, where /sys/class/drm holds no cards at all.
[backend]
name           = "llama-cpp"
api            = "openai"
weights_layout = "single-file"
mount_path     = "/models"
container_port = 8080
image_default  = "ghcr.io/ggml-org/llama.cpp:server-cuda"
# The cross-vendor backend, which is the reason it is worth having: Vulkan
# reaches AMD and Intel cards through the same `/dev/dri` render node R6-14
# hands the container, and components.json pins `server-vulkan` for `amd`
# beside the CUDA image above. Intel is named here on the same mechanism and
# no image is pinned for it yet -- so an Intel node is offered this backend and
# then refused at the image, which is the honest order: the backend runs there,
# this release has not pinned the bytes.
silicon        = ["nvidia", "amd", "intel"]

[backend.capabilities]
# It has `--tensor-split`, which divides one model's layers across cards by
# proportion. That is not tensor parallelism and saying `true` here would let a
# document written for vLLM move to this backend and mean something else.
tensor_parallel = false
expert_parallel = false
quantization    = ["gguf"]
lora            = false
# The reason this backend is worth having beyond a second vocabulary: it serves
# where VRAM is short or absent.
cpu_offload = true

[backend.args]
# `-m {v}`, with a space: Args splits a rendered template into separate argv
# elements for exactly this form.
model_path  = "-m {v}"
max_context = "-c {v}"
port        = "--port {v}"
# Without it the server binds loopback *inside* the container, which is not the
# loopback the published port maps to, and every request is refused by a
# deployment that reports healthy.
host = "--host {v}"

[backend.extra]
# Backend-specific and named: how many layers to put on the GPU. There is no
# canonical parameter for it because there is nothing to be canonical about --
# no other backend in this build expresses the idea at all.
gpu_layers = "-ngl {v}"
# Divides one model's layers across cards by proportion. Deliberately *not*
# tensor_parallel, which is why capabilities says false above -- a document
# written for vLLM that moved here would otherwise mean something else. Named
# here so it is reachable with a typo-checked spelling rather than only through
# raw extra_args, and so the refusal of tensor_parallel can point at it without
# nodary's code holding a fact about llama.cpp.
tensor_split = "--tensor-split {v}"

[backend.probe]
health = "/health"
# llama.cpp has one endpoint for both: /health answers 503 while the model is
# loading and 200 once it can serve, which is the distinction two probes exist
# to draw elsewhere.
ready = "/health"
# Lower than vLLM's and SGLang's half hour. A GGUF is loaded rather than
# compiled, so a llama.cpp server that has not answered in ten minutes is stuck
# rather than slow.
ready_timeout_s = 600

[backend.metrics]
# Served only with `--metrics`, which is not in the argv above; the path is
# recorded so that enabling it through extra_args needs no descriptor change.
path = "/metrics"
