# TensorRT-LLM. docs/specs/04-backends.md §6.
#
# **It has no [backend.prepare], and that is a correction rather than an
# omission.** R6-02 recorded this backend as blocked on R6-06's build phase,
# because TensorRT-LLM 0.x served an engine directory: convert_checkpoint.py,
# then `trtllm-build`, then serve what was produced — hours of work whose output
# had to be cached, which is the case §4's stage → prepare → serve exists for.
#
# 1.x's default path does not work that way. The quick-start invocation is
# `trtllm-serve "TinyLlama/TinyLlama-1.1B-Chat-v1.0"` against a HuggingFace
# checkpoint, and the engine is compiled in-process on first start. Read from
# the 1.2.0 sources this manifest's digest is a build of, not from memory:
# `trtllm-build` still exists for the TensorRT backend, and the serving path
# nodary drives does not use it.
#
# The consequence that matters is not the missing table. It is that
# `tensor_parallel` is a **runtime** flag here — `--tp_size`, parsed by
# trtllm-serve itself — so a descriptor that put {tp} in a build command would
# consume the parameter into a build and drop it from the argv of the server
# that actually wants it.
[backend]
name           = "tensorrt-llm"
api            = "openai"
weights_layout = "hf-cache"
mount_path     = "/root/.cache/huggingface"
container_port = 8000
image_default  = "nvcr.io/nvidia/tensorrt-llm/release:1.2.1"

[backend.capabilities]
tensor_parallel = true
# --ep_size, beside --tp_size and --pp_size.
expert_parallel = true
# **Empty, and not because it cannot serve quantized weights.** It serves them
# by being pointed at a quantized checkpoint — the quick-start's own second
# example is `nvidia/Qwen3-8B-FP8` — and there is no quantization *parameter*
# for this list to be the closed vocabulary of. Naming formats here would be a
# capability nothing can enforce, which is the shape of claim that reads as
# checked and is not.
quantization = []
# Supported by the runtime, reached through a configuration file rather than a
# flag, so there is nothing for a descriptor to translate yet.
lora        = false
cpu_offload = false

[backend.args]
# Positional, like vLLM's: `trtllm-serve <model>`. Args renders model_path
# first, which puts it where the entrypoint expects it.
model_path      = "{v}"
tensor_parallel = "--tp_size={v}"
max_context     = "--max_seq_len={v}"
# The nearest thing to vLLM's --gpu-memory-utilization: the share of free VRAM
# the KV cache may take. Not the same quantity as vLLM's, which is the share of
# *total* memory the whole engine may use, and the difference is worth knowing
# before moving a document between the two.
gpu_memory_fraction = "--kv_cache_free_gpu_memory_fraction={v}"
port                = "--port={v}"
# **Required, for llama.cpp's reason and measured the same way.** trtllm-serve's
# --host defaults to "localhost" (tensorrt_llm/commands/serve.py), so without
# this it binds loopback *inside* the container, which is not the loopback the
# published port maps to: the deployment reports healthy and refuses every
# request. vLLM needs no such line because its default is already 0.0.0.0.
host = "--host={v}"

[backend.probe]
health = "/health"
ready  = "/health"
# vLLM's half hour rather than llama.cpp's ten minutes: 1.x compiles the engine
# in-process on first start, so a server that has not answered in ten minutes is
# very likely still building rather than stuck.
ready_timeout_s = 1800

[backend.metrics]
path = "/metrics"
