<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>nodary — sign in</title>
<link rel="icon" href="nodary-mark.svg" type="image/svg+xml">
<link rel="stylesheet" href="app.css">
</head><body class="centred">
<main class="card">
 <picture>
  <source media="(prefers-color-scheme: dark)" srcset="nodary-dark.svg">
  <img class="brand" src="nodary.svg" alt="nodary" width="1588" height="353">
 </picture>
 <p class="tagline">Control plane</p>
 <p class="problem" id="problem" hidden></p>
 <form id="login" autocomplete="on">
  <label for="username">Username</label>
  <input id="username" name="username" autocomplete="username" autofocus required>
  <label for="password">Password</label>
  <input id="password" name="password" type="password" autocomplete="current-password" required>
  <button type="submit" class="primary">Sign in</button>
 </form>
</main>
<script src="login.js"></script>
</body></html>
