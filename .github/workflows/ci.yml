name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true
      - run: make check

  # R5-25. Does the tree build and pass under Go's FIPS 140-3 module, and does
  # TOTP's HMAC-SHA-1 survive it?
  #
  # docs/spike-fips-and-manifest.md answered that once, by hand: it builds, it
  # stays static, `fips140=on` passes everything, and `fips140=only` breaks
  # three of eight packages — HMAC-SHA-1 does not merely fail, it *panics*
  # inside hmac.New. This job answers it continuously and for free.
  #
  # **Non-gating on purpose.** docs/plans/mvp.md §5.6: blocking every pull
  # request on an unmeasured dependency, in service of a claim the MVP
  # explicitly does not make (§6 — "no FIPS-validated build shipped"), is the
  # wrong trade. It reports; a person reads it. Gating is R5-26's problem, once
  # there is an artifact that has to hold.
  fips:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true
      - name: The tree builds against the FIPS module
        env:
          GOFIPS140: v1.0.0
        run: go build ./...
      - name: The suite passes with the module enforcing
        env:
          GOFIPS140: v1.0.0
          GODEBUG: fips140=on
        run: go test ./... -timeout 900s
      - name: What `fips140=only` still refuses
        env:
          GOFIPS140: v1.0.0
          GODEBUG: fips140=only
        # Expected to fail while TOTP uses HMAC-SHA-1, which the module refuses
        # by panicking. Recorded rather than hidden: the output is the list of
        # what would have to change for ADR 0006's second gate to open.
        run: go test ./... -timeout 900s || true
      - name: It is still a static binary
        env:
          GOFIPS140: v1.0.0
          # CGO_ENABLED=0 explicitly, matching `make dist`. Without it this step
          # fails on every run and tells you nothing: Go's default is
          # CGO_ENABLED=1, which produces a dynamically linked binary whether
          # GOFIPS140 is set or not. Measured — a plain `go build` on the same
          # host is dynamic too. The question here is whether *FIPS* breaks the
          # property ADR 0002 and R0-16 depend on, and only a cgo-free build
          # asks it.
          CGO_ENABLED: "0"
        run: |
          go build -o /tmp/nodary-fips ./cmd/nodary
          file /tmp/nodary-fips
          if ! file /tmp/nodary-fips | grep -q 'statically linked'; then
            echo "::error::the FIPS build is not static; ADR 0002's property is broken"
            exit 1
          fi
          # The whole reason a FIPS artifact can be a second build rather than a
          # second pipeline: BoringCrypto needs cgo, Go's own module does not,
          # and the SQLite driver is modernc rather than cgo.
          echo "fips140 symbols: $(go tool nm /tmp/nodary-fips | grep -c fips140)"

  # The component manifest pins third-party artifacts by digest. A stale URL is
  # a broken install for everyone who runs it, so it fails here rather than on
  # someone's first attempt.
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - name: Every pinned artifact still resolves
        run: |
          go build -o /tmp/nodary ./cmd/nodary
          /tmp/nodary components verify

  # The `go` directive is a promise to contributors and downstream packagers,
  # and nothing exercised it — so it sat at 1.27 while the tree built fine on
  # 1.21, locking out every stock distro toolchain for no reason. Same shape as
  # the goreleaser config below: declared, unverified, wrong.
  #
  # GOTOOLCHAIN=local is what makes this a real test. Without it the `toolchain`
  # line would quietly upgrade the job to the release compiler and it would pass
  # no matter what the floor said.
  go-floor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: floor
        run: |
          v=$(grep -m1 '^go ' go.mod | awk '{print $2}')
          [ -n "$v" ] || { echo "::error::no go directive in go.mod"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v5
        with:
          go-version: "${{ steps.floor.outputs.version }}"
      - name: The declared floor builds and tests
        env:
          GOTOOLCHAIN: local
        run: |
          go version
          go build ./...
          go test ./...

  # staticcheck finds what the type system and `go vet` cannot. Its version is
  # pinned in the Makefile, and has to be: staticcheck 2025.1.1 cannot read a
  # Go 1.27 tree at all. A bleeding-edge `go` floor means third-party analysers
  # lag, and this will recur every February and August.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true
      - run: make lint

  # Reachability-based, so it reports a CVE only when this code can actually
  # reach the affected function. That is what makes it safe to block on: a
  # vulnerable dependency nodary genuinely calls is a reason to stop, and for a
  # product whose pitch is evidence and accountability it is cheap evidence.
  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true
      - run: make vuln

  # ADR 0002's whole thesis is one static binary with no interpreter and no host
  # runtime, and it is the property that survives least well by accident: a
  # single dependency pulling in cgo would end it silently, on one platform,
  # discovered by whoever installs on a host without the matching libc.
  #
  # Nothing asserted it. `make check` never builds, `go-floor` builds with the
  # runner's default CGO_ENABLED=1, and only `packages` reaches `make dist` —
  # where a successful build is not the same claim as a static one. R1-02 makes
  # this concrete by adding modernc.org/sqlite, whose reason for existing is
  # that it is pure Go.
  static-binary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true
      - name: Every ADR 0002 target cross-builds without cgo
        run: make dist
      - name: The host binary carries no dynamic linkage
        run: |
          bin="dist/nodary-$(cat VERSION)-linux-amd64"
          file "$bin"
          if ! file "$bin" | grep -q 'statically linked'; then
            echo "::error::$bin is not statically linked"
            exit 1
          fi
          # file(1) reports on the ELF type; NEEDED entries are the direct
          # evidence of a runtime dependency, so both are checked.
          if readelf -d "$bin" 2>/dev/null | grep -q NEEDED; then
            echo "::error::$bin declares dynamic dependencies"
            readelf -d "$bin"
            exit 1
          fi
          echo "static, no NEEDED entries"

  # The release config is only exercised by a tag, so a mistake in it surfaces
  # as a failed release rather than a failed pull request — which is how a
  # `checksums:`/`checksum:` typo sat here unnoticed until the first tag.
  #
  # `check` exits 1 for an invalid config and 2 for a valid one using
  # deprecated properties. Fail on the first, report the second.
  goreleaser-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          install-only: true
      - name: Release config is valid
        run: |
          set +e; goreleaser check; rc=$?; set -e
          case $rc in
            0) echo "configuration is valid" ;;
            2) echo "::warning::goreleaser config uses deprecated properties" ;;
            *) echo "::error::goreleaser config is invalid"; exit 1 ;;
          esac

  install-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - run: make test-install

  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: astral-sh/setup-uv@v5
      - run: make packages
      - run: make test-packages
