name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version to build, without the leading v
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: astral-sh/setup-uv@v5

      # A tag push carries the version in its name; a manual dispatch carries it
      # in the input. Preferring the input is what makes `required: true` mean
      # something. The input is passed through the environment rather than
      # interpolated into the script, so its contents stay data.
      #
      # goreleaser still derives its own version from git, so a dispatch outside
      # a tag builds a snapshot — the input names the release, it does not
      # conjure one.
      - id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          v="$INPUT_VERSION"
          [ -n "$v" ] || v="${GITHUB_REF_NAME#v}"
          echo "version=$v" >> "$GITHUB_OUTPUT"

      # Both signing keys are written to files the signers can be pointed at,
      # then removed. Neither is ever committed and neither is ever echoed.
      #
      # The minisign key must be passwordless (`minisign -G -W`): goreleaser
      # invokes the signer non-interactively, and an encrypted key would block
      # the release on a password prompt nobody is there to answer.
      - name: Stage the signing keys
        env:
          SIGNING_KEY: ${{ secrets.NODARY_SIGNING_KEY }}
          MINISIGN_KEY: ${{ secrets.NODARY_MINISIGN_KEY }}
        run: |
          umask 077
          test -n "$SIGNING_KEY"  || { echo "NODARY_SIGNING_KEY is empty"  >&2; exit 1; }
          test -n "$MINISIGN_KEY" || { echo "NODARY_MINISIGN_KEY is empty" >&2; exit 1; }
          printf '%s' "$SIGNING_KEY"  > /tmp/nodary-release.key
          printf '%s\n' "$MINISIGN_KEY" > /tmp/nodary-minisign.key
          echo "NODARY_SIGNING_KEY=/tmp/nodary-release.key"    >> "$GITHUB_ENV"
          echo "NODARY_MINISIGN_KEY=/tmp/nodary-minisign.key"  >> "$GITHUB_ENV"

      # components.json embeds nodary_version from the VERSION file, so a tag
      # that disagrees with it ships a binary describing itself as some other
      # release. Catch that here rather than in someone's manifest.
      # Not in the runner image. goreleaser's minisign signer needs it, and so
      # does the install.sh signature below.
      - name: Install minisign
        run: sudo apt-get update -qq && sudo apt-get install -y -qq minisign

      - name: VERSION file agrees with the release being built
        run: |
          want="${{ steps.version.outputs.version }}"
          have=$(cat VERSION)
          test "$want" = "$have" || {
            echo "releasing $want but VERSION says $have — bump VERSION first" >&2
            exit 1
          }

      # The install.sh in the repository is a development copy: placeholder key,
      # development version. Publishing it verbatim would hand every user an
      # installer that refuses to verify and fetches the wrong release, so the
      # shipped copy is built from it here. goreleaser uploads build/install.sh.
      - name: Stamp install.sh for this release
        run: |
          umask 077
          openssl ec -in "$NODARY_SIGNING_KEY" -pubout -out /tmp/nodary-release.pub
          hack/stamp-install.sh \
              --version "${{ steps.version.outputs.version }}" \
              --pubkey /tmp/nodary-release.pub \
              -o build/install.sh

      # 01-install.md §2 tells users to verify install.sh out of band before
      # running it. That is the one check that does not depend on trusting
      # whoever serves the script, so the signature has to exist — and it has to
      # be made after stamping, because stamping is what changes the bytes.
      #
      # The trusted comment is covered by the signature, so naming the version
      # there means a signature cannot be lifted onto a different release.
      - name: Sign the stamped install.sh
        run: |
          minisign -S -s "$NODARY_MINISIGN_KEY" \
              -m build/install.sh -x build/install.sh.minisig \
              -c "nodary installer" \
              -t "nodary ${{ steps.version.outputs.version }} install.sh"

          # Verify before publishing rather than trusting the signer exited 0.
          minisign -R -s "$NODARY_MINISIGN_KEY" -p /tmp/nodary-minisign.pub
          minisign -Vm build/install.sh -x build/install.sh.minisig -p /tmp/nodary-minisign.pub

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITHUB_TOKEN is scoped to this repository; pushing the formula to
          # nodarynet/homebrew-tap needs a token that reaches it.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - run: rm -f /tmp/nodary-release.key /tmp/nodary-minisign.key /tmp/nodary-release.pub /tmp/nodary-minisign.pub
        if: always()

      # nodary.net is the origin install.sh hardcodes, so the artifacts have to
      # be there and not only in GitHub Releases. Uploading from dist/ rather
      # than from the release object also sidesteps `release.draft: true`, which
      # makes a GitHub asset undownloadable until someone publishes the draft.
      - name: Publish to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          # Recent AWS CLI versions send integrity headers R2 rejects outright.
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          BUCKET: nodary-releases
          V: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          put() { # put <local path> <key> <content-type> <cache-control>
            aws s3 cp "$1" "s3://$BUCKET/$2" \
                --endpoint-url "$R2_ENDPOINT" \
                --content-type "$3" --cache-control "$4" --only-show-errors
            echo "  put $2"
          }

          # `archives: formats: [binary]` does NOT write a renamed file: the
          # templated name is upload metadata, while the path stays
          # dist/nodary_<target>/nodary. artifacts.json is the only authoritative
          # mapping between the two, so read it rather than guessing filenames.
          # `.extra.ID` separates the archive artifacts (id "binary") from the
          # raw build outputs (id "nodary"), which share the type "Binary".
          A=dist/artifacts.json
          [ -f "$A" ] || { echo "no $A — did goreleaser run?" >&2; exit 1; }

          uploads=$(jq -r '.[]
            | select((.type=="Binary" and .extra.ID=="binary")
                     or .type=="Checksum" or .type=="Signature")
            | "\(.name)\t\(.path)"' "$A")

          mapfile -t names < <(printf '%s\n' "$uploads" | cut -f1)

          # Every platform needs its binary, its digest and both signatures, or
          # someone downloads an artifact they cannot verify.
          missing=0
          bins=0
          for n in "${names[@]}"; do
            case "$n" in *.sha256|*.sig|*.minisig) continue ;; esac
            bins=$((bins + 1))
            for ext in sha256 sig minisig; do
              printf '%s\n' "${names[@]}" | grep -qx -- "$n.$ext" \
                || { echo "missing $n.$ext" >&2; missing=1; }
            done
          done
          [ "$bins" -eq 4 ] || { echo "expected 4 platform binaries, found $bins" >&2; missing=1; }
          [ "$missing" -eq 0 ] || { echo "refusing to publish a partial release" >&2; exit 1; }

          # A version-scoped path never changes its contents, so it caches forever.
          while IFS=$'\t' read -r name path; do
            case "$name" in
              *.sha256|*.sig|*.minisig) ct="text/plain; charset=utf-8" ;;
              *)                        ct="application/octet-stream" ;;
            esac
            put "$path" "releases/$V/$name" "$ct" "public, max-age=31536000, immutable"
          done <<< "$uploads"

          # install.sh is overwritten every release, so it must not cache for
          # long: a year-long TTL here pins every `curl … | sh` to whatever
          # shipped first. It is served as text/plain so it can be read in a
          # browser before anyone pipes it to a shell.
          #
          # A prerelease publishes its artifacts but must not touch the
          # installer at the apex, or `curl … | sh` starts handing out release
          # candidates. `prerelease: auto` in .goreleaser.yaml keys off the same
          # semver prerelease suffix.
          case "$V" in
            *-*) echo "prerelease $V — artifacts published, install.sh left alone" ;;
            *)
              for f in install.sh install.sh.minisig; do
                put "build/$f" "$f" "text/plain; charset=utf-8" "public, max-age=300"
              done
              ;;
          esac

      - name: Build channel packages
        run: |
          make wheels npm VERSION=${{ steps.version.outputs.version }}
          make test-packages VERSION=${{ steps.version.outputs.version }}

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            dist/wheels/
            dist/npm/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      # Trusted Publishing: PyPI verifies this workflow's OIDC identity, so no
      # long-lived API token exists to leak.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist }
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/wheels

  npm:
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist }
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: https://registry.npmjs.org

      # npm assigns `latest` to whatever was published most recently unless a
      # tag is given, so a prerelease would quietly become what `npm i -g
      # nodary` installs. PyPI needs no equivalent guard: pip already excludes
      # prereleases unless asked for them.
      - id: npmtag
        run: |
          case "${{ needs.build.outputs.version }}" in
            *-*) echo "tag=next"   >> "$GITHUB_OUTPUT" ;;
            *)   echo "tag=latest" >> "$GITHUB_OUTPUT" ;;
          esac

      # Platform packages first: the entry package's optionalDependencies must
      # already resolve, or the first person to install it gets a broken tree.
      - name: Publish platform packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for p in dist/npm/nodary-*/; do
            npm publish --provenance --access public --tag ${{ steps.npmtag.outputs.tag }} "$p"
          done

      - name: Publish entry package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public --tag ${{ steps.npmtag.outputs.tag }} dist/npm/nodary
